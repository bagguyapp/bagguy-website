<!--meta
title: Reset your password
description: Choose a new password for your Bag Guy account.
out: reset-password/index.html
path: /reset-password/
robots: noindex,nofollow
-->
<article class="article">
  <div class="wrap narrow">
    <p class="eyebrow">Account</p>
    <h1>Reset your password</h1>
    <form id="reset-form" hidden>
      <p><label for="pw1">New password (at least 6 characters)</label><br>
      <input id="pw1" type="password" autocomplete="new-password" minlength="6" maxlength="128" required style="width:100%;padding:.6em;font-size:1em"></p>
      <p><label for="pw2">Type it again</label><br>
      <input id="pw2" type="password" autocomplete="new-password" minlength="6" maxlength="128" required style="width:100%;padding:.6em;font-size:1em"></p>
      <p><button class="btn btn-primary" type="submit">Save new password</button></p>
    </form>
    <p id="reset-msg" role="status" aria-live="polite">This page needs the link from your password reset email. If you need help getting back into your account, email <a href="mailto:support@bagguyapp.com">support@bagguyapp.com</a> from the address you signed up with.</p>
  </div>
</article>
<script>
(function () {
  var token = new URLSearchParams(location.search).get("token") || "";
  var form = document.getElementById("reset-form"), msg = document.getElementById("reset-msg");
  if (!token) return;
  history.replaceState(null, "", location.pathname);
  form.hidden = false; msg.textContent = "";
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var a = document.getElementById("pw1").value, b = document.getElementById("pw2").value;
    if (a.length < 6) { msg.textContent = "Use at least 6 characters."; return; }
    if (a !== b) { msg.textContent = "The two passwords don't match."; return; }
    msg.textContent = "Saving...";
    fetch("https://api.bagguyapp.com/auth/reset-password", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token, new_password: a })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok) { form.hidden = true; msg.textContent = "Your password was changed. Open Bag Guy and sign in with your new password."; }
        else { msg.textContent = (res.j && res.j.error) || "That link has expired or was already used. Email support@bagguyapp.com for help."; }
      })
      .catch(function () { msg.textContent = "Couldn't reach Bag Guy. Check your connection and try again."; });
  });
})();
</script>
