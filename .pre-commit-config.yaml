# P0-5b: local secret scan before each commit. Setup (once per clone):
#   pip install pre-commit && pre-commit install
# CI runs the same scanner over the full history (.github/workflows/secret-scan.yml),
# so a skipped hook is still caught on push.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
